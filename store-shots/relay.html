<!doctype html>
<meta charset="utf-8">
<title>relay</title>
<script>
// Temporary helper: hands the public screenshot files in this folder to the page that embeds it.
window.addEventListener('message', async (e) => {
  if (!e.data || !Array.isArray(e.data.want)) return;
  for (const path of e.data.want) {
    if (!/^[\w\-\/]+\.png$/.test(path)) continue;
    const r = await fetch(path);
    const buf = await r.arrayBuffer();
    e.source.postMessage({ name: path.split('/').pop(), status: r.status, buf }, e.origin, [buf]);
  }
  e.source.postMessage({ done: true }, e.origin);
});
parent.postMessage({ ready: true }, '*');
</script>
